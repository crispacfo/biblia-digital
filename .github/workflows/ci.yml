name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          find . -path ./vendor -prune -o -path ./node_modules -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

  phpcs:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: cs2pr

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: vendor/bin/phpcs --report-full --report-checkstyle=phpcs-report.xml
        continue-on-error: true

      - name: Annotate pull request
        run: cs2pr --graceful-warnings phpcs-report.xml

  phpunit:
    name: PHPUnit WP ${{ matrix.wp }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          # The suite requires an existing empty database: install-wp-tests.sh
          # is invoked with skip-db-create=true, so the service creates it.
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exact versions only: install-wp-tests.sh rejects branches and never
          # falls back to 'latest', so the tested version is always the one here.
          # Declared minimum: WordPress 6.6 + PHP 7.4.
          - { wp: '6.6.5', php: '7.4' }
          # Target line: WordPress 7.0.x across modern PHP.
          - { wp: '7.0.2', php: '8.3' }
          - { wp: '7.0.2', php: '8.4' }
          - { wp: '7.0.2', php: '8.5' }
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip
          coverage: none
          tools: composer

      - name: Install Composer dev dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install WordPress test suite
        run: |
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }} true

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  build:
    name: Build distributable ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIP from .distignore
        run: bash bin/build-zip.sh

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: biblia-digital-zip
          path: dist/biblia-digital.zip

      - name: Lint built PHP tree
        run: |
          find dist/biblia-digital -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  plugin-check:
    name: WordPress.org Plugin Check (on built ZIP)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIP from .distignore
        run: bash bin/build-zip.sh

      - name: Run Plugin Check against the built tree
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: 'dist/biblia-digital'
